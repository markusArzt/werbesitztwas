# --- Politischer Stand -----------------------------------------------------

at_nr_ablehnung_2026:
  wert: "am 25. Februar 2026 mehrheitlich abgelehnt"
  beschreibung: "Ablehnung eines Dringlichen Antrags auf Wiedereinführung von Erbschafts- und Schenkungssteuern für hohe Vermögen sowie einer Erbersatzsteuer für Privatstiftungen im Nationalrat"
  quelle: "Parlamentskorrespondenz Nr. 135 vom 25.02.2026; Antrag 693/A(E), XXVIII. GP"
  erhebungsjahr: 2026
  veroeffentlicht: "2026-02-25"
  url: "https://www.parlament.gv.at/aktuelles/pk/jahr_2026/pk0135"
  abgerufen: "2026-08-01"
  konfidenz: hoch
  hinweis: >
    PFLICHT. Gehört in den Abschnitt "Was offen zuzugeben ist", nicht in
    eine Fussnote. Wer den aktuellen politischen Stand verschweigt, wirkt
    unehrlich, sobald ihn jemand nachschlägt.
    TON: als demokratisches Ergebnis darstellen, nicht als Skandal. Der
    Antrag fand keine Mehrheit, weil ihn keine andere Fraktion unterstützte.
    IM SICHTBAREN TEXT KEINE PARTEI- UND PERSONENNAMEN. Das ist eine
    bewusste Entscheidung: Die Kampagne will auch Menschen erreichen, deren
    Partei dagegen gestimmt hat. Die Sachargumente referieren, nicht die
    Lager. Für die Belegseite hier festgehalten: abgelehnt bzw. nicht
    unterstützt von allen anderen Fraktionen; der Finanzminister sprach
    sich in der Debatte für eine Millionenerbschaftssteuer aus, erwartete
    aber keine Mehrheit in dieser Legislaturperiode und nannte eine
    Größenordnung von deutlich über einer Milliarde Euro jährlich.
    Gegner nannten hohen Verwaltungsaufwand, Betriebsübergaben und
    Standortwirkungen; eine Gegenrechnung im Plenum bezifferte das
    diskutierte Modell mit rund 1,5 Mrd. Euro bzw. 0,7 Prozent der
    Steuereinnahmen. Diese 0,7 Prozent stützen unseren eigenen zentralen
    Absatz - sie stammen von der Gegenseite und sind deshalb besonders
    brauchbar.

at_zustimmung_vermoegensteuer:
  wert: "im Schnitt rund 71 Prozent Zustimmung"
  beschreibung: "Durchschnittliche Zustimmung zur Wiedereinführung einer Vermögensteuer in Österreich über zwölf Umfragen zwischen 2009 und 2016"
  quelle: "Elsässer/Fastenrath/Rehm (2023), European Political Science Review 15(2), referiert in Europäische Kommission, CASE u. a., Wealth Taxation: Volume 2, Kapitel 1.9 (Österreich)"
  erhebungsjahr: 2016
  veroeffentlicht: "2026-04-15"
  url: "https://doi.org/10.1017/S1755773922000510"
  abgerufen: "2026-08-01"
  konfidenz: mittel
  hinweis: >
    VORSICHTIG VERWENDEN. Datenstand ist alt (2009 bis 2016) und die Frage
    lautete auf "Vermögensteuer", nicht auf unsere Forderungen. Nie als
    Zustimmung zu diesem Forderungskatalog ausgeben.
    KEIN ARGUMENT FÜR SICH. Nur als Kontrast zum Abstimmungsergebnis
    verwenden und ausdrücklich dazusagen, dass eine Umfrage eine
    parlamentarische Mehrheit nicht ersetzt. Sonst kippt der Abschnitt ins
    Populistische, und das ist genau der Ton, den diese Seite vermeidet.
    Ergänzend aus derselben Quelle: In einer Befragung von Fessler u. a.
    (2023) lag die Zustimmung bei 74 Prozent, wenn gleichzeitig die
    Einkommensteuer gesenkt würde. Die Medienberichterstattung zu
    Vermögensteuern ist überwiegend ablehnend (Dammerer u. a. 2023).


