    Papier diskutierten Stiftungsäquivalent (550 bis 700 Mio.). Korrekt:
    1,354 Mrd. (Modell II, proportional) bis 1,828 Mrd. (Modell IV, progressiv,
    Betriebsvermögen zu 85 % und Hauptwohnsitz vollständig befreit), jeweils
    2025 und nach Abzug von Ausweicheffekten. Ohne Ausweicheffekte 1,75 bis
    2,42 Mrd. Bei 500.000 Euro Freibetrag: 892 Mio. bis 1,43 Mrd.
    Nie ohne Modellangabe zitieren. Aufkommen ist auf dieser Seite nachgeordnet
    und darf nie die Überschrift tragen.


