    GEGENARGUMENT. Beleg für den großen sozialen Wohnbau und gehört
    verpflichtend in den Kasten "Das sagt die Gegenseite". Restliche
    Anteile: Richtwertmietzins 13,4 %, Kategoriemietzins 1,3 %. Gemeinde
    plus Genossenschaft ergibt 54,2 % des Mietbestands. Große regionale
    Unterschiede: Wien 25,9 % Gemeinde, Vorarlberg 55,4 % private
    Hauptmiete am freien Markt. Wer nur den Österreich-Schnitt nennt,
    beschreibt für einzelne Bundesländer etwas Falsches.

at_vermieterstruktur_unbekannt:
  wert: "keine amtliche Unterscheidung zwischen privaten und gewerblichen Vermietern"
  beschreibung: >
    In der amtlichen Wohnstatistik umfasst die Kategorie "andere bzw. private
    Hauptmiete" Wohnungen, die von einer Privatperson oder einer sonstigen
    juristischen Person, etwa einer Bank oder Versicherung, vermietet werden.
    Beide werden nicht getrennt ausgewiesen.
  quelle: "Statistik Austria, Definitionen zur Mikrozensus-Wohnungserhebung, Pressemitteilung 14 136-055/26"
  erhebungsjahr: 2025
  veroeffentlicht: "2026-03-13"
  url: "https://www.statistik.at/fileadmin/announcement/2026/03/20260313Wohnen2025Q4.pdf"
  abgerufen: "2026-07-24"
  konfidenz: hoch
  hinweis: >
    Das Wohn-Pendant zur Transparenzlücke des Projekts, belegt aus der
    Definition der amtlichen Statistik selbst. Vorsicht bei der
    Formulierung: Es gibt sehr wohl Registerdaten zum Eigentum an GEBÄUDEN
    (Gebäude- und Wohnungszählung, Merkmal Eigentumsverhältnis, zuletzt
    Abgestimmte Erwerbsstatistik 2024). Die Aussage stimmt für die Frage,
    wer VERMIETETE WOHNUNGEN hält. Nicht zu "über Immobilieneigentum gibt es
    keine Daten" verkürzen, das wäre falsch und leicht zu widerlegen.

at_wien_vermieter_gewerblich:
  wert: "52 Prozent Privatpersonen, 42 Prozent Unternehmen"
  beschreibung: "Art der Vermietung im privaten Mietsegment in Wien, nach Angabe der befragten Mieterinnen und Mieter"
  quelle: "OGM research & communication im Auftrag der MA 50 der Stadt Wien, Befragung von Mieter*innen zum Mietrecht im privaten Wohnungssegment, Endbericht 2024, Abbildung 7"
  erhebungsjahr: 2024
  veroeffentlicht: "2024-05"
  url: "https://www.wien.gv.at/spezial/studien/ma50/mieterinnenbefragungendbericht2024.pdf"
  abgerufen: "2026-07-24"
  konfidenz: strittig
  hinweis: >
    NUR MIT VOLLSTÄNDIGER EINSCHRÄNKUNG VERWENDEN. Vier Einschränkungen,
    alle vier gehören in den Text oder unmittelbar daneben:
    (1) nur Wien, (2) nur das private Mietsegment, das rund 45 % der Wiener
    Mietwohnungen ausmacht, (3) Selbstauskunft der Mieter:innen, nicht
    Grundbuch — 5 % wissen es selbst nicht, (4) Online-Panel-Quotenstichprobe
    mit N=507, Schwankungsbreite bis 4,4 Prozentpunkte.
    Zusatzbefund: private Vermietung überwiegt im Altbau, gewerbliche im
    Neubau. Diese Zahl trägt kein Argument, sie illustriert nur, dass wir
    nichts Besseres haben. Wenn im Lektorat Zweifel bestehen, ersatzlos
    streichen und nur at_vermieterstruktur_unbekannt stehen lassen.


# ---------------------------------------------------------------------------
# Wohnen: Zugang zu Eigentum (OeNB HFCS 2023)
# ---------------------------------------------------------------------------

at_eigentumsquote_vermoegenshaelften:
  wert: "92 Prozent gegenüber 4 Prozent"
  beschreibung: "Anteil der Haushalte mit Eigentum am Hauptwohnsitz in der vermögenderen gegenüber der ärmeren Hälfte der Nettovermögensverteilung, 2023"
  quelle: "OeNB, HFCS Austria 2023, OeNB Report 2025/21, Kapitel 2.1"
  erhebungsjahr: 2023
  veroeffentlicht: "2025-12"
  url: "https://www.oenb.at/dam/jcr:c9b54df1-dd15-4722-9e81-cf78abb57d35/report-2025-21-hfcs-first-results.pdf"
  abgerufen: "2026-07-24"
  konfidenz: hoch
  hinweis: >
    2010 lagen dieselben Werte bei 87 und 9 Prozent. Die OeNB bezeichnet das
    Muster ausdrücklich als über die Zeit ausgeprägter geworden. Das ist die
    einzige Stelle des Moduls, an der eine Verschärfung über die Zeit sauber
    belegt ist — sie deshalb nicht überdehnen und keine Trendfortschreibung
    daraus machen. Achtung, Zirkularität: Wohneigentum ist selbst
    Bestandteil des Nettovermögens, nach dem die Hälften gebildet werden.
    Der Zusammenhang ist teilweise definitorisch. Wer das nicht dazusagt,
    wird in der ersten Fachdiskussion darauf gestoßen.

at_mieter_eigenmittel:
  wert: "rund 12 Prozent für ein Haus, rund 16 Prozent für eine Wohnung"
  beschreibung: "Anteil der Mieterhaushalte, deren Nettovermögen für die erforderlichen Eigenmittel beim Kauf einer durchschnittlich großen Immobilie ausreichen würde"
  quelle: "OeNB, HFCS Austria 2023, OeNB Report 2025/21, Chart 10"
  erhebungsjahr: 2023
  veroeffentlicht: "2025-12"
  url: "https://www.oenb.at/dam/jcr:c9b54df1-dd15-4722-9e81-cf78abb57d35/report-2025-21-hfcs-first-results.pdf"
  abgerufen: "2026-07-24"
  konfidenz: mittel
  hinweis: >
    Modellrechnung, keine Messung. Annahme der OeNB: 20 Prozent
    Eigenmittelanteil zuzüglich 10 Prozent Nebenkosten, Kaufpreise nach
    Statistik Austria 2024, Flächen 140 m² (Haus) und 70 m² (Wohnung) aus den
    HFCS-Medianen. Mietfrei wohnende Haushalte sind in der Gruppe der
    Mieter:innen enthalten. Im Text immer als Schätzung kennzeichnen.

at_erbe_eigentumszugang:
  wert: "in jedem Lebensalter höhere Eigentumsquote bei Haushalten mit Erbschaft oder Schenkung"
  beschreibung: "Zusammenhang zwischen erhaltenen Vermögensübertragungen und Eigentum am Hauptwohnsitz über den Lebensverlauf"
  quelle: "OeNB, HFCS Austria 2023, OeNB Report 2025/21, Chart 16 und Kapitel 2.1"
  erhebungsjahr: 2023
  veroeffentlicht: "2025-12"
  url: "https://www.oenb.at/dam/jcr:c9b54df1-dd15-4722-9e81-cf78abb57d35/report-2025-21-hfcs-first-results.pdf"
  abgerufen: "2026-07-24"
  konfidenz: mittel
  hinweis: >
    Der größte Abstand liegt zwischen 35 und 60 Jahren. Ergänzende Zahlen aus
    derselben Quelle: Haushalte mit besichertem Kredit haben zu 51 Prozent
    geerbt oder etwas geschenkt bekommen, Haushalte mit nur unbesicherter
    Verschuldung zu 33 Prozent; die Mediane der Übertragungen liegen bei
    79.900 gegenüber 34.200 Euro.
    BESCHREIBENDER ZUSAMMENHANG, KEIN KAUSALER NACHWEIS. Die OeNB formuliert
    vorsichtig ("often provides the decisive step"). Wir bleiben mindestens
    genauso vorsichtig.


