at_erbvolumen_2025_2050:
  wert: "rund 21,5 Mrd. Euro (2025) auf rund 40,8 Mrd. Euro (2050)"
  beschreibung: "Geschätztes jährliches Erbvolumen in Österreich"
  quelle: "Grünberger/Derndorfer/Schnetzer (2024), Wirtschaft und Gesellschaft 50(1), Kapitel 3.1"
  erhebungsjahr: 2022
  veroeffentlicht: "2024-04"
  url: "https://journals.akwien.at/index.php/wug/article/download/230/217/2393"
  abgerufen: "2026-07-24"
  konfidenz: strittig
  hinweis: >
    Modellrechnung, keine Messung. Datengrundlage ist der HFCS 2017, Basisjahr
    2022, Werte in Preisen von 2022. Das Modell hält die Vermögen über den
    gesamten Zeitraum konstant und rechnet Inflation heraus; die Autor:innen
    verstehen ihre Werte deshalb ausdrücklich als Untergrenze. Frühere
    Schätzungen (Altzinger/Humer 2013) lagen deutlich niedriger. Im Text immer
    als Schätzung kennzeichnen und die Konstanzannahme mitliefern.


