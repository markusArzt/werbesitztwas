# --- Forderung 1: Register -------------------------------------------------

at_kontenregister:
  wert: "zentrales Register aller Konten, Depots und Schließfächer, ohne Kontostände"
  beschreibung: "In Österreich seit 2016 bestehendes Kontenregister: erfasst Konten, Depots und Schließfächer aller Privatpersonen und Unternehmen; enthält keine Kontostände und keine Bewegungen; Zweckbindung, Vier-Augen-Prinzip bei der Abfrage, Verständigung der betroffenen Person über FinanzOnline"
  quelle: "Kontenregister- und Konteneinschaugesetz (KontRegG), BGBl. I Nr. 116/2015 idgF; BMF, Kontenregister und Konteneinschau"
  erhebungsjahr: 2026
  url: "https://www.bmf.gv.at/themen/betrugsbekaempfung/kontenregister-konteneinschau.html"
  abgerufen: "2026-08-01"
  konfidenz: hoch
  hinweis: >
    TRÄGT DEN ZENTRALEN ABSATZ ZUR ERSTEN FORDERUNG. Rechtstatsache, kein
    Schätzwert. Der Punkt ist die Präzedenz: Ein zweckgebundenes zentrales
    Register über Vermögenspositionen existiert bereits und gilt nicht als
    Überwachung.
    WICHTIGE EINSCHRÄNKUNG, die im Text stehen MUSS: Das Kontenregister
    enthält KEINE Kontostände. Es kann Vermögen also nicht messen. Wer
    behauptet, das Register mache ein Vermögensregister überflüssig oder
    liefere die fehlenden Daten, irrt. Die Aussage ist ausschliesslich:
    Rechtsform und Datenschutzarchitektur sind erprobt. Nicht mehr.
    Ergänzend bestehen Grundbuch, Firmenbuch und das Register der
    wirtschaftlichen Eigentümer (WiEReG, BGBl. I Nr. 136/2017).

eu_studie_register:
  wert: "umfassende Vermögensregister und Meldepflichten Dritter als notwendige Voraussetzung"
  beschreibung: "Befund der Studie für die Europäische Kommission, dass umfassende Vermögensregister, Meldepflichten Dritter, automatischer Informationsaustausch und Digitalisierung der Finanzverwaltung mit höherer Steuerehrlichkeit und besserem Vollzug einhergehen"
  quelle: "Europäische Kommission, CASE, Robaszewski, A., Skowronek, A., Płonka, H. u. a., Wealth Taxation, Including Net Wealth, Capital and Exit Taxes: Executive Summary, Publications Office of the European Union, Luxemburg 2026, Abschnitte Cross-cutting insights und Key take-aways"
  veroeffentlicht: "2026-04-15"
  url: "https://op.europa.eu/en/publication-detail/-/publication/61fca3fa-3872-11f1-be39-01aa75ed71a1"
  abgerufen: "2026-08-01"
  konfidenz: hoch
  hinweis: >
    Der beste verfügbare Beleg für die Hauptforderung, weil er nicht von
    einer Kampagne stammt. WIFO war Konsortialführer, CASE Projektleiter.
    ZUSCHREIBUNG GENAU NEHMEN: Es ist eine Studie IM AUFTRAG der Kommission,
    keine Position der Kommission. Der Rechtstext sagt ausdrücklich, dass
    die Ansichten die der Autorinnen und Autoren sind. Formulierung im Text
    daher "Studie für die Europäische Kommission", nie "die EU-Kommission
    fordert".

at_eugh_transparenzregister:
  wert: "öffentlicher Zugang für ungültig erklärt, Register selbst nicht beanstandet"
  beschreibung: "Urteil des Europäischen Gerichtshofs vom 22.11.2022, wonach der Zugang aller Mitglieder der Öffentlichkeit zu den Daten wirtschaftlicher Eigentümer ein schwerwiegender Eingriff in die Grundrechte auf Achtung des Privatlebens und auf Schutz personenbezogener Daten ist (Art. 7 und 8 GRC)"
  quelle: "EuGH (Große Kammer), Urteil vom 22.11.2022, verbundene Rechtssachen C-37/20 und C-601/20"
  erhebungsjahr: 2022
  veroeffentlicht: "2022-11-22"
  abgerufen: "2026-08-01"
  konfidenz: hoch
  hinweis: >
    GEGENARGUMENT, das stärkste zur Hauptforderung. Gehört in den Kasten
    und darf nicht kleingeredet werden - es ist ein Urteil, keine Meinung.
    ENTSCHEIDENDE UNTERSCHEIDUNG, ohne die die Wiedergabe unfair wäre:
    Für ungültig erklärt wurde Art. 1 Nr. 15 lit. c der Richtlinie (EU)
    2018/843, also die Pflicht zum Zugang OHNE Nachweis eines berechtigten
    Interesses. Die Register selbst und der Zugang von Behörden und
    Verpflichteten blieben unberührt. Österreich hat die öffentliche
    Einsicht daraufhin sofort eingestellt.
    DARAUS FOLGT FÜR UNSERE FORDERUNG: Ein öffentlich einsehbares
    Vermögensregister NIE fordern. Das wäre nach dieser Rechtsprechung
    nicht haltbar und würde die Forderung insgesamt beschädigen.
    Belegt derzeit über Kanzleipublikationen; vor Livegang die Urteils-
    fundstelle (curia.europa.eu) direkt setzen.


# --- Forderung 3: koordinierte Mindeststeuer -------------------------------

welt_zucman_mindeststeuer:
  wert: "effektive Mindestbesteuerung von 2 Prozent des Nettovermögens"
  beschreibung: "Vorschlag für einen international koordinierten Mindeststeuerstandard für sehr vermögende Personen; die Wahl des Instruments bleibt den einzelnen Staaten überlassen, bereits gezahlte Einkommensteuern werden angerechnet"
  quelle: "Zucman (2024), A blueprint for a coordinated minimum effective taxation standard for ultra-high-net-worth individuals, Bericht für die brasilianische G20-Präsidentschaft"
  veroeffentlicht: "2024-06"
  url: "https://gabriel-zucman.eu/files/report-g20.pdf"
  abgerufen: "2026-08-01"
  konfidenz: hoch
  hinweis: >
    Konfidenz "hoch" bezieht sich auf Existenz und Inhalt des VORSCHLAGS,
    nicht auf dessen Wirkung. Im Text sauber trennen.
    HÄUFIGSTER FEHLER, auch bei Befürwortern: Der Vorschlag schreibt keine
    Vermögensteuer vor. Er formuliert eine Untergrenze für die effektive
    Gesamtbelastung; ein Staat kann sie über Kapitalertrag-, Einkommen-
    oder Vermögensteuern erreichen. Wer bereits substanziell Einkommen-
    steuer zahlt, zahlt nichts zusätzlich. Wer das als "globale
    Vermögensteuer" wiedergibt, gibt es falsch wieder.
    Zum G20-Kontext: 2024 unter brasilianischer Präsidentschaft auf der
    Agenda. Eine Verpflichtung ist daraus NICHT entstanden. Nicht mehr
    behaupten, als da ist.

welt_zucman_variante_frankreich:
  wert: "Nationalversammlung dafür, Senat dagegen"
  beschreibung: "Abstimmung der französischen Nationalversammlung im Februar 2025 über eine Mindeststeuer von 2 Prozent auf Nettovermögen über 100 Millionen Euro; die Vorlage fand im Senat keine Mehrheit"
  quelle: "Europäische Kommission, CASE u. a., Wealth Taxation: Volume 2, Kapitel 3.8 (Frankreich)"
  erhebungsjahr: 2025
  veroeffentlicht: "2026-04-15"
  url: "https://op.europa.eu/en/publication-detail/-/publication/61fca3fa-3872-11f1-be39-01aa75ed71a1"
  abgerufen: "2026-08-01"
  konfidenz: hoch
  hinweis: >
    IMMER BEIDE KAMMERN NENNEN. Die Zahl der Publikationen, die nur die
    Zustimmung der Nationalversammlung berichten und das Scheitern im Senat
    weglassen, ist groß. Wer das übernimmt, wird korrigiert und verliert
    die Glaubwürdigkeit für den ganzen Abschnitt. Betroffen wären nach
    französischen Angaben rund 1.800 Haushalte.

at_mindeststeuer_100mio:
  zahl: 1.9
  wert: "rund 1,9 Mrd. Euro bei 2 Prozent, rund 3,4 Mrd. Euro bei 3 Prozent"
  spanne: "1,9 Mrd. (2 Prozent) bis 3,4 Mrd. (3 Prozent), jeweils Vermögen über 100 Mio. Euro"
  beschreibung: "Geschätztes jährliches Aufkommen einer effektiven Mindeststeuer auf Nettovermögen über 100 Millionen Euro in Österreich"
  quelle: "Parrinello, Q., Varaschin, G., Zucman, G. (2025), Resources for a Safe and Resilient Europe: The Case for Minimum Taxation of Ultra-High-Net-Worth Individuals in the EU, EU Tax Observatory, Tabelle 1, Zeile Österreich"
  erhebungsjahr: 2025
  veroeffentlicht: "2025-03"
  url: "https://www.taxobservatory.eu/www-site/uploads/2025/03/Resources-for-a-Safe-and-Resilient-Europe_The-Case-for-Minimum-Taxation-of-Ultra-High-Net-Worth-Individuals-in-the-EU-1.pdf"
  abgerufen: "2026-08-01"
  konfidenz: strittig
  hinweis: >
    KORREKTUR AM BRIEFING. Die Zahl stimmt, die Zuschreibung war falsch.
    Sie stammt NICHT aus der Studie der EU-Kommission und nicht vom WIFO,
    sondern aus einer Auswertung des EU Tax Observatory vom März 2025.
    Österreich-Zeile: 10 Milliardäre, 72,0 Mrd. USD bzw. 68,6 Mrd. EUR,
    daraus 1,9 Mrd. bei 2 Prozent (davon 1,2 Mrd. von Milliardären) und
    3,4 Mrd. bei 3 Prozent. Auf der Website daher NIE "laut EU-Kommission"
    oder "laut WIFO" - das wäre angreifbar und sachlich unrichtig.
    METHODENKRITIK, gehört offengelegt:
    (a) Datengrundlage ist die Forbes-Echtzeitliste, abgerufen am 3.3.2025.
    Reichenliste, keine Erhebung - dieselbe Kritik wie bei
    at_anteil_top1_hochgeschaetzt. Das ist kein Nachteil für uns: Es ist
    das Argument für das Register.
    (b) Der Wert für Centi-Millionäre ist KEINE eigenständige Schätzung,
    sondern der Milliardärswert multipliziert mit einem aus Zucman (2024)
    übernommenen Faktor (1,55 bei 2 Prozent, 1,79 bei 3 Prozent). Also eine
    Hochrechnung auf eine Hochrechnung.
    (c) Unterstellt wird eine derzeitige effektive Belastung von 0,2 Prozent
    des Vermögens - eine Annahme für alle EU-Staaten gleich, nicht für
    Österreich gemessen.
    (d) Statische Rechnung OHNE Verhaltensreaktionen. Bei
    at_erbst_aufkommen_1mio sind Ausweicheffekte abgezogen, hier nicht. Die
    beiden Werte sind daher nicht sauber addierbar. Wenn addiert wird, dann
    ausdrücklich nur als Größenordnung und mit diesem Hinweis.
    (e) NIE ohne die Schwelle nennen. "1,9 Mrd." ohne "ab 100 Mio." ist die
    Vorlage für den Mittelstands-Vorwurf.

