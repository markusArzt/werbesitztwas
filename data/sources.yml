# ===========================================================================
# Ergänzungen zu data/sources.yml — Modul B "Herkunft schlägt Leistung"
#
# Teil 1: KORREKTUREN an bestehenden Einträgen (bitte ersetzen)
# Teil 2: NEUE Einträge
#
# Alle Werte am 2026-07-24 gegen die Primärquelle geprüft.
# Zwei Primärquellen tragen dieses Modul:
#   OeNB Report 2025/21 (HFCS Austria 2023, Erstergebnisse), Tabelle 7
#   Grünberger/Derndorfer/Schnetzer (2024), Wirtschaft und Gesellschaft 50(1), 21-41
# ===========================================================================


# ---------------------------------------------------------------------------
# TEIL 1 — Korrekturen
# Beide Einträge stammten aus Sekundärquellen und halten der Primärquelle
# nicht stand. Bitte in der bestehenden Registry ersetzen.
# ---------------------------------------------------------------------------

at_erben_nichts:
  zahl: 59.3
  wert: "knapp sechs von zehn"
  beschreibung: "Anteil der Haushalte in Österreich, die noch nie eine Erbschaft oder größere Schenkung erhalten haben"
  quelle: "OeNB, HFCS Austria 2023, OeNB Report 2025/21, Tabelle 7"
  erhebungsjahr: 2023
  veroeffentlicht: "2025-12-04"
  url: "https://www.oenb.at/dam/jcr:c9b54df1-dd15-4722-9e81-cf78abb57d35/report-2025-21-hfcs-first-results.pdf"
  abgerufen: "2026-07-24"
  konfidenz: hoch
  hinweis: >
    KORREKTUR. Der frühere Wert "sieben von zehn" (Quelle moment.at) ist nicht
    belegbar. Die Primärquelle nennt 40,7 % Haushalte mit Erbschaft oder
    Schenkung, also 59,3 % ohne. Auch die ältere Welle 2017 lag bei 62 %, nie
    bei 70 %. Bezugseinheit ist der Haushalt, nicht die Person: Die Quote je
    Einzelperson liegt niedriger, weil ein Haushalt schon dann als
    "Erbenhaushalt" zählt, wenn ein Mitglied geerbt hat.

at_erbe_verteilung:
  wert: "83.300 Euro gegenüber 3,4 Millionen Euro"
  beschreibung: "Durchschnittliche Erbschaft insgesamt gegenüber der durchschnittlichen Erbschaft im obersten Perzentil der Erbschaftsverteilung, Schätzung für 2025"
  quelle: "Grünberger/Derndorfer/Schnetzer (2024), Wirtschaft und Gesellschaft 50(1), Tabelle 2 und Kapitel 3.1"
  erhebungsjahr: 2022
  veroeffentlicht: "2024-04"
  url: "https://journals.akwien.at/index.php/wug/article/view/230"
  abgerufen: "2026-07-24"
  konfidenz: mittel
  hinweis: >
    KORREKTUR. Der frühere Wert "124.000 Euro für die unteren 90 Prozent"
    stammt aus arbeit-wirtschaft.at (2022) und lässt sich in keiner
    Primärstudie wiederfinden; der Datenstand dahinter ist zudem überholt.
    Nicht mehr verwenden. Der Vergleichspunkt 3,4 Mio. ist dagegen bestätigt.
    Siehe at_erbe_durchschnitt und at_erbe_top1, die diesen Eintrag ersetzen.


