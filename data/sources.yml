# === Modul E ===
# ---------------------------------------------------------------------------
# Modul E - "Du bildest dir das nicht ein"
# Anhaengen an data/sources.yml.
#
# HINWEIS zur Benennung: Diese Eintraege beschreiben weltweite Werte und
# tragen deshalb das Praefix "welt_" statt "at_". Falls der Build die IDs
# gegen ein Muster prueft, das "at_" erzwingt, hier umbenennen.
# ---------------------------------------------------------------------------


# --- Die Kurve selbst ------------------------------------------------------

welt_gic_datenbasis:
  wert: "rund 120 Länder, 1988 bis 2008"
  beschreibung: "Datenbasis der Elefantenkurve: harmonisierte Haushaltsbefragungen, kaufkraftbereinigt, jedes Land in Dezile geteilt"
  quelle: "Lakner/Milanović (2016), Global Income Distribution: From the Fall of the Berlin Wall to the Great Recession, World Bank Economic Review 30(2), 203-232"
  erhebungsjahr: 2008
  veroeffentlicht: "2016"
  url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2366598"
  abgerufen: "2026-07-31"
  konfidenz: hoch
  hinweis: >
    Die Erstfassung erschien 2013 als World-Bank-Arbeitspapier, die zitierte
    Fassung 2016 begutachtet. Eine noch frühere Version von 2012 zeigte bei
    Punkt B sogar einen Rückgang; diese Fassung NICHT verwenden, sie kursiert
    aber weiterhin.

welt_gic_median:
  zahl: 75
  perzentil: 50
  wert: "rund 75 Prozent"
  kurzwert: "rund +75 %"
  beschreibung: "Kumuliertes reales Einkommenswachstum rund um den globalen Median zwischen 1988 und 2008"
  quelle: "Lakner/Milanović (2016), dargestellt und nachgerechnet vom Center for Global Development"
  erhebungsjahr: 2008
  url: "https://www.cgdev.org/blog/chart-week-1-elephant-graph-flattening-out"
  abgerufen: "2026-07-31"
  konfidenz: mittel
  sekundaerquelle: true
  hinweis: >
    Der Punktwert stammt aus der Nachrechnung des CGD ("roughly 75 percent
    cumulative income growth", knapp 3 Prozent pro Jahr). Lakner/Milanović
    selbst beschreiben den Bereich verbal. Vor Livegang gegen Abbildung 1
    der WBER-Fassung prüfen. Nur gemeinsam mit welt_wachstum_konstantbev
    verwenden - einzeln suggeriert der Wert eine Präzision, die die
    Methodenkritik nicht trägt.

welt_gic_p80:
  zahl: 0
  perzentil: 80
  wert: "nahe null"
  kurzwert: "nahe null"
  spanne: "sehr geringes bis nahezu null Wachstum, je nach Perzentil zwischen 80 und 90"
  beschreibung: "Reales Einkommenswachstum rund um das 80. globale Perzentil zwischen 1988 und 2008, dort überwiegend untere und mittlere Einkommensgruppen der reichen Länder"
  quelle: "Milanović (2024), The three eras of global inequality 1820-2020, World Development 177, 106516; Lakner/Milanović (2016)"
  erhebungsjahr: 2008
  veroeffentlicht: "2024-01"
  url: "https://doi.org/10.1016/j.worlddev.2023.106516"
  abgerufen: "2026-07-31"
  konfidenz: strittig
  hinweis: >
    NIE als exakte Null darstellen. Die Quellen formulieren "very sluggish,
    or almost zero" beziehungsweise "almost negligible around the 85th-90th
    global percentiles". Das Feld "zahl" dient allein der Positionierung in
    der Grafik, beschriftet wird mit dem Feld "wert". Genau dieser Punkt ist
    der methodisch am stärksten angegriffene der ganzen Kurve, siehe
    welt_kritik_corlett_schluss.

welt_gic_top1:
  zahl: 60
  perzentil: 99
  wert: "rund 60 Prozent"
  kurzwert: "rund +60 %"
  spanne: "60 bis 65 Prozent je nach Darstellung"
  beschreibung: "Kumuliertes reales Einkommenswachstum des reichsten Prozents weltweit zwischen 1988 und 2008"
  quelle: "Lakner/Milanović (2016); Einordnung bei Corlett (2016), Resolution Foundation"
  erhebungsjahr: 2008
  url: "https://www.resolutionfoundation.org/app/uploads/2016/09/Examining-an-elephant.pdf"
  abgerufen: "2026-07-31"
  konfidenz: strittig
  hinweis: >
    Corlett weist darauf hin, dass die relative Leistung des globalen
    obersten Prozents in der Originalgrafik überzeichnet ist, unter anderem
    weil der Originalcode ungleich große Perzentile erzeugt. Gleichzeitig
    erfassen Haushaltsbefragungen die allerhöchsten Einkommen schlecht, was
    in die andere Richtung wirkt. Deshalb Spanne, nie Punktwert im Text.


# --- Die Kritik, quantifiziert ---------------------------------------------

welt_wachstum_original:
  zahl: 24
  wert: "24 Prozent"
  beschreibung: "Durchschnittliches reales Wachstum des weltweiten Pro-Kopf-Einkommens 1988 bis 2008, wie in der Originalfassung der Elefantenkurve ausgewiesen"
  quelle: "Lakner/Milanović (2016), nachgerechnet bei Corlett (2016), Examining an elephant, Resolution Foundation"
  erhebungsjahr: 2008
  veroeffentlicht: "2016-09"
  url: "https://www.resolutionfoundation.org/app/uploads/2016/09/Examining-an-elephant.pdf"
  abgerufen: "2026-07-31"
  konfidenz: hoch
  hinweis: "Nur im Dreiervergleich mit welt_wachstum_konsistent und welt_wachstum_konstantbev verwenden."

welt_wachstum_konsistent:
  zahl: 32
  wert: "32 Prozent"
  beschreibung: "Dasselbe Wachstum, gerechnet mit einem in beiden Jahren identischen Länderkreis"
  quelle: "Corlett (2016), Examining an elephant, Resolution Foundation, Abschnitt 3"
  erhebungsjahr: 2008
  veroeffentlicht: "2016-09"
  url: "https://www.resolutionfoundation.org/app/uploads/2016/09/Examining-an-elephant.pdf"
  abgerufen: "2026-07-31"
  konfidenz: mittel
  hinweis: >
    Grund für die Differenz: 2008 sind Länder enthalten, die 1988 fehlen,
    darunter Russland, Vietnam, Südafrika, DR Kongo. Sie haben
    unterdurchschnittliche Einkommen und drücken das Wachstum. Preis der
    Korrektur: nur noch 60 statt 130 Länder, dadurch größeres Gewicht von
    China und Indien. Fair bleiben und das mitsagen.

welt_wachstum_konstantbev:
  zahl: 41
  wert: "41 Prozent"
  beschreibung: "Dasselbe Wachstum, gerechnet mit identischem Länderkreis und zusätzlich konstant gehaltenen Bevölkerungsanteilen der Länder"
  quelle: "Corlett (2016), Examining an elephant, Resolution Foundation, Abbildung 8"
  erhebungsjahr: 2008
  veroeffentlicht: "2016-09"
  url: "https://www.resolutionfoundation.org/app/uploads/2016/09/Examining-an-elephant.pdf"
  abgerufen: "2026-07-31"
  konfidenz: mittel
  hinweis: >
    KERNZAHL DES MODULS. Corlett zeigt, dass der reine Bevölkerungseffekt
    ohne jedes Einkommenswachstum die Kurve rund um das 75. Perzentil um bis
    zu ein Viertel nach unten zieht. In dieser Rechnung liegt das
    Mindestwachstum über die Verteilung bei 26 Prozent, ausgenommen das
    unterste Prozent. Es ist eine Illustration des Effekts, keine
    Alternativmessung - so auch im Text kennzeichnen.

welt_wachstum_reifeoekonomien:
  wert: "rund 52 Prozent über zwanzig Jahre, etwa 2 Prozent pro Jahr"
  beschreibung: "Durchschnittliches Einkommenswachstum in den reifen Volkswirtschaften 1988 bis 2008, ohne Japan und ohne die Nachfolge- und Satellitenstaaten der Sowjetunion"
  quelle: "Corlett (2016), Examining an elephant, Resolution Foundation, Abschnitt 3"
  erhebungsjahr: 2008
  veroeffentlicht: "2016-09"
  url: "https://www.resolutionfoundation.org/app/uploads/2016/09/Examining-an-elephant.pdf"
  abgerufen: "2026-07-31"
  konfidenz: mittel
  hinweis: >
    Japan fällt wegen der geplatzten Blase heraus und weil Corlett die
    zugrunde liegenden Japan-Daten für fehlerhaft hält (minus 24 Prozent
    Realeinkommen 2002 bis 2008 bei gleichzeitig steigendem BIP pro Kopf).
    Die osteuropäischen Staaten fallen wegen des Einbruchs nach 1989
    heraus. Beide Ausschlüsse sind begründet, aber Eingriffe - im Text
    offenlegen, nicht als neutrale Bereinigung darstellen. Österreich ist
    in der verbleibenden Gruppe enthalten.

welt_kritik_corlett_schluss:
  wert: "von den Daten nicht getragen, mit Ausnahme der USA"
  beschreibung: "Schlussfolgerung der Resolution Foundation zur These, die Einkommen der unteren Mittelschicht der reichen Länder hätten zwischen 1988 und 2008 stagniert"
  quelle: "Corlett (2016), Examining an elephant, Resolution Foundation, Abschnitt 5"
  veroeffentlicht: "2016-09"
  url: "https://www.resolutionfoundation.org/app/uploads/2016/09/Examining-an-elephant.pdf"
  abgerufen: "2026-07-31"
  konfidenz: hoch
  hinweis: >
    GEGENARGUMENT, das gewichtigste des Moduls. Verpflichtend in den Kasten.
    Corlett bestreitet ausdrücklich NICHT, dass die Gewinne innerhalb der
    Länder ungleich verteilt waren. Sein Punkt ist enger: keine Stagnation
    über die Gesamtperiode. Lakner und Milanović haben 2016 geantwortet;
    diese Erwiderung vor Livegang beschaffen und ergänzen.

welt_gic_deutung_offen:
  wert: "mit beiden Erklärungen vereinbar"
  beschreibung: "Einordnung von Branko Milanović, dass die Elefantenkurve sowohl eine internationale Deutung (Abstand zwischen globaler Mitte und 80. Perzentil) als auch eine innerstaatliche Deutung (Abstand zwischen 80. Perzentil und Spitze) zulässt und die Daten zwischen beiden nicht entscheiden"
  quelle: "Milanović (2024), The three eras of global inequality 1820-2020, World Development 177, 106516, Abschnitt 2.2"
  veroeffentlicht: "2024-01"
  url: "https://doi.org/10.1016/j.worlddev.2023.106516"
  abgerufen: "2026-07-31"
  konfidenz: hoch
  hinweis: >
    TRÄGT DEN KERN DES MODULS und ist die Absicherung gegen Regel 8. Als
    innerstaatliche Faktoren nennt Milanović niedrigere Besteuerung hoher
    Einkommen, qualifikationsverzerrten technischen Fortschritt und
    ungewöhnlich hohe Kapitalrenditen. Er nennt sie als mögliche Ursachen,
    nicht als belegte. Diesen Unterschied im Text halten.


# --- Nach 2008 -------------------------------------------------------------

welt_gic_2008_2018:
  wert: "rund 1,3 Prozent pro Jahr an der Spitze, rund 7 Prozent pro Jahr im ärmsten Fünftel"
  beschreibung: "Reales Einkommenswachstum 2008 bis 2018: reichstes Prozent weltweit gegenüber dem ärmsten Fünftel der Weltbevölkerung"
  quelle: "Milanović (2024), The three eras of global inequality 1820-2020, World Development 177, 106516, Abschnitt 2.2 und Tabelle 1"
  erhebungsjahr: 2018
  veroeffentlicht: "2024-01"
  url: "https://doi.org/10.1016/j.worlddev.2023.106516"
  abgerufen: "2026-07-31"
  konfidenz: mittel
  hinweis: >
    GEGENARGUMENT. In den Kasten. Der Wert für das unterste Fünftel beträgt
    in Tabelle 1 genau 7,4 Prozent und ist quasi nicht-anonym gerechnet.
    Milanović selbst relativiert ihn: ein Teil der Verbesserung entsteht
    dadurch, dass die chinesische Landbevölkerung das unterste Fünftel
    verlassen hat und andere nachgerückt sind. Diese Einschränkung
    mitliefern, sonst ist die Zahl zu gut, um wahr zu sein. Der niedrige
    Wert an der Spitze geht wesentlich auf die Finanzkrise in den USA zurück.

