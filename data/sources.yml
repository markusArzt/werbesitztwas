at_lohnquote_verlauf:
  wert: "bis 2007 gesunken, seither steigend, zuletzt markant"
  beschreibung: "Entwicklung des Anteils der Arbeitnehmerentgelte am Volkseinkommen in Österreich"
  quelle: "Bittschi/Schiman-Vukan (2025), Die Lohnquote in Österreich, Wirtschaft und Gesellschaft 51(3), 67-97"
