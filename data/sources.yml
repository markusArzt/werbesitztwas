eu_studie_aufkommen_gering:
  wert: "derzeit in den meisten Mitgliedstaaten keine nennenswerten Einnahmen"
  beschreibung: "Querschnittsbefund der Studie für die Europäische Kommission, dass keine der untersuchten vermögensbezogenen Steuern in den meisten Mitgliedstaaten substanzielle Einnahmen erbringt, bei langfristig eher sinkendem Aufkommen trotz wachsender Privatvermögen"
  quelle: "Europäische Kommission, CASE u. a., Wealth Taxation: Executive Summary, Abschnitt Cross-cutting insights"
  veroeffentlicht: "2026-04-15"
  url: "https://op.europa.eu/en/publication-detail/-/publication/61fca3fa-3872-11f1-be39-01aa75ed71a1"
  abgerufen: "2026-08-01"
  konfidenz: hoch
  hinweis: >
    DOPPELT VERWENDBAR, und beides ist beabsichtigt. Als Gegenargument im
    Kasten und als Beleg für den zentralen Absatz: Ja, das Aufkommen ist
    klein - das ist der Punkt, nicht der Einwand.
    Begründung der Studie: hohe Freibeträge, breite Ausnahmen,
    Begünstigungen, teils sinkende Sätze. Also eine Aussage über die
    AUSGESTALTUNG, nicht über das Instrument. Diese Hälfte immer
    mitliefern, sonst ist die Wiedergabe unfair.

eu_studie_investitionen:
  wert: "Effekte in der Regel moderat, Befundlage zur internationalen Mobilität dünn"
  beschreibung: "Einschätzung der Studie für die Europäische Kommission zu den Wirkungen vermögensbezogener Steuern auf Sparen, Investitionen und Unternehmertum sowie zur Abwanderung sehr vermögender Personen"
  quelle: "Europäische Kommission, CASE u. a., Wealth Taxation: Executive Summary, Abschnitte Net wealth taxes und Key take-aways"
  veroeffentlicht: "2026-04-15"
  url: "https://op.europa.eu/en/publication-detail/-/publication/61fca3fa-3872-11f1-be39-01aa75ed71a1"
  abgerufen: "2026-08-01"
  konfidenz: mittel
  hinweis: >
    BEIDE HÄLFTEN VERWENDEN, sonst ist es Rosinenpickerei.
    Günstig für uns: Effekte auf Sparen, Investitionen und Unternehmertum
    fallen laut Studie in der Regel moderat aus; gut ausgestaltete Steuern
    können produktivere Vermögensverwendung fördern; Mobilitäts-
    reaktionen werden häufig überschätzt.
    Ungünstig für uns und ebenso wichtig: Zur internationalen Mobilität
    sehr vermögender Personen ist die Evidenz ausdrücklich begrenzt. Die
    Studie spricht sich zudem NICHT für eine breite laufende Vermögen-
    steuer aus, sondern hält gut funktionierende Kapitalertrag- und
    Erbschaftsteuern für das Rückgrat.
    KEINE Kausalaussage daraus ableiten, die über "nicht abschliessend
    geklärt" hinausgeht.

eu_studie_simulation_oesterreich:
  wert: "5,6 bis 6,8 Mrd. Euro je nach Ausgestaltung"
  beschreibung: "Im Österreich-Kapitel der Studie referierte Simulation des möglichen Aufkommens einer laufenden Nettovermögensteuer sowie Befunde zur früheren österreichischen Vermögensteuer"
  quelle: "Heck/Hornykewycz/Kapeller/Wildauer (2024), referiert in Europäische Kommission, CASE u. a., Wealth Taxation: Volume 2, Kapitel 1.5 und 1.9 (Österreich)"
  erhebungsjahr: 2024
  veroeffentlicht: "2026-04-15"
  url: "https://op.europa.eu/en/publication-detail/-/publication/61fca3fa-3872-11f1-be39-01aa75ed71a1"
  abgerufen: "2026-08-01"
  konfidenz: strittig
  hinweis: >
    NUR für den Abschnitt "Aufkommensschätzungen schwanken stark" und für
    den Kasten. NICHT als Forderung der Kampagne ausgeben - wir fordern
    keine laufende Vermögensteuer.
    Werte: 1 Prozent ab 1 Mio. ergibt 5,6 Mrd. (starke Ausweichreaktionen)
    bis 6,3 Mrd. (schwache); progressiv 0,5 / 1 / 2 Prozent ab 1 / 10 /
    50 Mio. ergibt 6,1 bis 6,8 Mrd. Schwelle ab 1 Mio. - also eine deutlich
    größere Gruppe als unsere Forderungen. Bei Verwendung MUSS die
    Schwelle mitgenannt werden.
    Zweiter Teil ist GEGENARGUMENT: Die alte österreichische Vermögensteuer
    (1 Prozent, abgeschafft 1994) brachte zuletzt 0,47 Prozent des BIP,
    scheiterte an veralteten Einheitswerten, Bankgeheimnis und
    Selbstdeklaration; 1993 entfielen rund 71 Prozent des Aufkommens auf
    Unternehmen, nicht auf Privatvermögen.

at_keine_empirie_vermoegensteuer:
  wert: "keine empirischen Befunde für Österreich"
  beschreibung: "Feststellung der Studie für die Europäische Kommission, dass zu wirtschaftlich relevanten Verhaltensreaktionen auf die frühere österreichische Vermögensteuer keine empirische Evidenz existiert und es keine Hinweise auf steuerbedingte Abwanderung gibt"
  quelle: "Europäische Kommission, CASE u. a., Wealth Taxation: Volume 2, Kapitel 1.6 (Österreich)"
  veroeffentlicht: "2026-04-15"
  url: "https://op.europa.eu/en/publication-detail/-/publication/61fca3fa-3872-11f1-be39-01aa75ed71a1"
  abgerufen: "2026-08-01"
  konfidenz: hoch
  hinweis: >
    Belegt die Formulierung "empirisch nicht geklärt" - und zwar in BEIDE
    Richtungen. Es gibt keine Belege für Abwanderung, aber auch keine
    dagegen. Die Studie erklärt das fehlende Abwanderungsproblem damit,
    dass die Steuer ohnehin leicht zu umgehen war. Das ist kein Argument
    für Wirksamkeit. NICHT zu "Abwanderung findet nicht statt" verkürzen.

welt_abwanderung_evidenz:
  wert: "0,003 bis 0,03 Prozent jährlicher Rückgang je Prozentpunkt"
  beschreibung: "Geschätzte Reaktion der Zahl sehr vermögender Steuerpflichtiger in Frankreich auf eine Erhöhung ihrer Besteuerung um einen Prozentpunkt; nach der Umstellung von der Vermögensteuer auf die Immobilienvermögensteuer gingen die Wegzüge zurück"
  quelle: "Bach, L., Bozio, A., Grimprel, N., Guillouzouic, A., Landais, C., Malgouyres, C. (2025), Conseil d'Analyse Économique, Focus Nr. 118; France Stratégie (2023), referiert in Wealth Taxation: Volume 2, Kapitel 3.6"
  erhebungsjahr: 2025
  veroeffentlicht: "2026-04-15"
  url: "https://www.cae-eco.fr/static/pdf/Focus_118_emigration_fiscale_250725_v2.pdf"
  abgerufen: "2026-08-01"
  konfidenz: mittel
  hinweis: >
    GEGENGEWICHT zu at_norwegen_wegzuege, gehört direkt daneben. Beide
    Fälle nennen oder keinen.
    Zusatzbefunde aus derselben Quelle: 2018 bis 2021 im Schnitt 380
    Rückkehrer gegen 260 Wegzüge pro Jahr, davor 370 gegen 950. Die
    Mobilität an der Spitze der Kapitaleinkommensverteilung liegt bei etwa
    der Hälfte des landesweiten Durchschnitts.
    EINSCHRÄNKUNG MITLIEFERN: Frankreich ist nicht Österreich, und die
    Studie kann nicht klären, wie viele Wegzüge tatsächlich steuerlich
    motiviert waren. Kein Beweis, dass Abwanderung kein Thema ist.

at_verfassung_vermoegensteuer:
  wert: "Bewertungsreform nötig; Endbesteuerungsgesetz mit Verfassungsrang"
  beschreibung: "Verfassungsrechtliche Hürden für vermögensbezogene Steuern in Österreich: die Unterbewertung von Grundvermögen, wegen der der Verfassungsgerichtshof 2007 die Erbschaftssteuer aufhob, sowie das Endbesteuerungsgesetz, das Finanzvermögen mit kapitalertragsteuerpflichtigen Erträgen einer Vermögensteuer entzieht"
  quelle: "Europäische Kommission, CASE u. a., Wealth Taxation: Volume 2, Kapitel 1.8 (Österreich); Endbesteuerungsgesetz, BGBl. Nr. 11/1993"
  veroeffentlicht: "2026-04-15"
  url: "https://op.europa.eu/en/publication-detail/-/publication/61fca3fa-3872-11f1-be39-01aa75ed71a1"
  abgerufen: "2026-08-01"
  konfidenz: hoch
  hinweis: >
    GEGENARGUMENT, und das präziseste im Kasten. Wer hier unsauber
    formuliert, wird von jeder Steuerrechtlerin zerlegt.
    DIE UNTERSCHEIDUNG IST ENTSCHEIDEND und stützt unsere Reihenfolge:
    Für die ERBSCHAFTSSTEUER ist die Hürde eine Bewertungsreform, also
    einfachgesetzlich lösbar. Für eine LAUFENDE VERMÖGENSTEUER auf
    Finanzvermögen braucht es eine Verfassungsänderung, weil das
    Endbesteuerungsgesetz Verfassungsrang hat. Genau deshalb steht in
    diesem Modul die Übertragungssteuer und keine laufende Vermögensteuer.
    NICHT behaupten, das Register brauche eine Verfassungsänderung - dafür
    gibt es keinen Beleg, und das Kontenregister spricht dagegen.
    
