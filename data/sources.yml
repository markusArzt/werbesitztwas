at_miete_vertragsdauer:
  wert: "12,4 Euro je Quadratmeter bei Verträgen unter zwei Jahren, 6,5 Euro ab 30 Jahren"
  beschreibung: "Durchschnittliche Miete inklusive Betriebskosten nach bisheriger Dauer des Mietverhältnisses, 2025"
