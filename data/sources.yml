  hinweis: >
    Gesamtdurchschnitt 2025: 10,2 Euro je Quadratmeter inklusive
    Betriebskosten, im 4. Quartal 10,4 Euro. Die Spreizung nach Vertragsalter
    ist kein reiner Preiseffekt, sondern hängt auch an Lage, Baujahr und
    Mietrechtsregime der jeweiligen Bestände. Nicht als
    "Neumieter zahlen doppelt" verkürzen.

at_wohnkosten_anstieg_10jahre:
  wert: "rund 35 Prozent insgesamt, knapp 40 Prozent bei Mietverhältnissen"
  beschreibung: "Anstieg der monatlichen Wohnkosten von 2015 bis 2025"
  quelle: "Statistik Austria, Pressemitteilung 14 197-116/26, EU-SILC"
  erhebungsjahr: 2025
  veroeffentlicht: "2026-06-10"
  url: "https://www.statistik.at/fileadmin/announcement/2026/06/20260610Wohnen2025.pdf"
  abgerufen: "2026-07-24"
  konfidenz: hoch
  hinweis: >
    Nominal, nicht inflationsbereinigt. Der Verbraucherpreisindex ist im
    selben Zeitraum ebenfalls deutlich gestiegen — wer die 35 Prozent ohne
    diesen Hinweis nennt, suggeriert einen realen Anstieg in dieser Höhe.
    Immer gemeinsam mit at_wohnkostenanteil_stabil führen.

at_wohnkostenanteil_stabil:
  wert: "15 Prozent (2025) gegenüber 16 Prozent (2015)"
  beschreibung: "Anteil der Wohnkosten am verfügbaren Haushaltseinkommen, Mittelwert über alle Privathaushalte"
  quelle: "Statistik Austria, Pressemitteilung 14 197-116/26, EU-SILC"
  erhebungsjahr: 2025
  veroeffentlicht: "2026-06-10"
  url: "https://www.statistik.at/fileadmin/announcement/2026/06/20260610Wohnen2025.pdf"
  abgerufen: "2026-07-24"
  konfidenz: hoch
  hinweis: >
    GEGENARGUMENT. Gehört verpflichtend in den Kasten "Das sagt die
    Gegenseite". Die stärkste Einzelzahl gegen eine dramatisierende
    Wohnkostenerzählung, und sie kommt von der amtlichen Statistik.
    Wer sie weglässt und stattdessen nur den Anstieg von 35 Prozent nennt,
    verliert die Diskussion beim ersten Faktencheck.

at_wohnkosten_belastung_gruppen:
  wert: "29 Prozent bei Ein-Eltern-Haushalten, 28 Prozent bei alleinlebenden Frauen"
  beschreibung: "Anteil der Wohnkosten am verfügbaren Haushaltseinkommen bei besonders belasteten Haushaltstypen, 2025"
  quelle: "Statistik Austria, Pressemitteilung 14 197-116/26, EU-SILC"
  erhebungsjahr: 2025
  veroeffentlicht: "2026-06-10"
  url: "https://www.statistik.at/fileadmin/announcement/2026/06/20260610Wohnen2025.pdf"
  abgerufen: "2026-07-24"
  konfidenz: hoch
  hinweis: >
    Gegengewicht zum Durchschnittswert von 15 Prozent. Rund 80 Prozent der
    Ein-Eltern-Haushalte sind Mutter-Kind-Konstellationen; mehr als die
    Hälfte berichtet von starker Belastung durch die Wohnkosten. Ursache ist
    laut Quelle wesentlich die Wohnform: Mütter mit Kindern leben zu
    54,0 Prozent zur Miete, Väter mit Kindern zu 38,6 Prozent.

at_baukosten_index:
  wert: "130,9 Indexpunkte im Dezember 2025, Basis 2020 = 100"
  beschreibung: "Baukostenindex für den Wohnhaus- und Siedlungsbau, Gesamtbaukosten"
  quelle: "Statistik Austria, Baukostenindex Wohnhaus- und Siedlungsbau, Statistik im Fokus 2.12, Dezember 2025"
  erhebungsjahr: 2025
  veroeffentlicht: "2026-01"
  url: "https://www.statistik.at/fileadmin/publications/SB_2-12_Wohnhaus_Siedlungsbau_Dezember_2025.pdf"
  abgerufen: "2026-07-24"
  konfidenz: mittel
  hinweis: >
    GEGENARGUMENT. Beleg für den Einwand, dass Wohnkosten auch von der
    Kostenseite getrieben werden. Vorläufiger Wert. Im Text als
    "rund ein Drittel über dem Niveau von 2020" führen, nicht als exakte
    Prozentzahl — der Index misst Kosten der Bauunternehmen, nicht
    Baupreise für Bauherren, und die Publikationsreihe endet mit dem
    Basisjahr 2020. Ab dem Basisjahr 2025 sind die Werte nur noch online
    verfügbar, der Eintrag ist deshalb ab 2027 zu prüfen.

at_bodenwert_oeffentliche_investition:
  wert: "Wertzuwächse durch öffentliche Infrastruktur fallen bei den Eigentümern an"
  beschreibung: >
    Feststellung der OeNB, dass Grundstückswerte durch öffentliche
    Investitionen in Verkehr, Schulen und Gesundheitseinrichtungen steigen,
    der Nutzungswert selbst bewohnten Eigentums in Österreich nicht besteuert
    wird und Grundsteuern niedrig sind.
  quelle: "OeNB, HFCS Austria 2023, OeNB Report 2025/21, Kapitel 5; ausführlich Fessler/Schürz (2018), Journal of Human Development and Capabilities 19(4)"
  erhebungsjahr: 2023
  veroeffentlicht: "2025-12"
  url: "https://www.oenb.at/dam/jcr:c9b54df1-dd15-4722-9e81-cf78abb57d35/report-2025-21-hfcs-first-results.pdf"
  abgerufen: "2026-07-24"
  konfidenz: hoch
  hinweis: >
    Qualitative Aussage der Notenbank, keine bezifferte Wirkung. Nicht zu
    einer Zahl ausbauen und nicht als Forderung nach einer bestimmten Steuer
    lesen. Der Wert für uns liegt darin, dass eine staatliche Institution den
    Zusammenhang zwischen öffentlicher Investition und privatem
    Vermögenszuwachs selbst benennt.

at_sozialstaat_ersetzt_vermoegen:
  wert: "Sozialstaat ersetzt private Vorsorge in der unteren Hälfte"
  beschreibung: "Einordnung der OeNB, dass gemessene Vermögensungleichheit in Ländern mit ausgebautem Sozialstaat nicht direkt als Maß wirtschaftlicher Unsicherheit gelesen werden kann"
  quelle: "OeNB, HFCS Austria 2023, OeNB Report 2025/21, Kapitel 1.2 und Kapitel 6; Fessler/Schürz (2018)"
  erhebungsjahr: 2023
  veroeffentlicht: "2025-12"
  url: "https://www.oenb.at/dam/jcr:c9b54df1-dd15-4722-9e81-cf78abb57d35/report-2025-21-hfcs-first-results.pdf"
  abgerufen: "2026-07-24"
  konfidenz: hoch
  hinweis: >
    GEGENARGUMENT, und das gewichtigste des ganzen Projekts. Die OeNB nennt
    drei Ebenen: Pensionsversicherung, Gesundheitsversorgung und
    Arbeitslosenversicherung ersetzen private Vorsorge unten; Wohnbau- und
    Eigentumsförderung stützen die Mitte; günstige steuerliche Behandlung von
    Kapital und Kriseninterventionen stabilisieren oben. Der Satz gilt also
    nicht nur gegen uns — die dritte Ebene ist unser eigenes Argument.
    Beide Hälften des Zitats verwenden, sonst ist die Wiedergabe unfair.


