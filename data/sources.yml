  abgerufen: "2026-07-31"
  konfidenz: strittig
  hinweis: >
    BEWUSST OHNE PUNKTWERTE. Die häufig zitierten Zahlen (Höchstwert 77,2
    Prozent 1978, 68,4 Prozent 2017, also minus 9 Prozentpunkte) stammen aus
    dem A&W-Blog der AK und sind damit parteinah; ausserdem hängt das
    Ergebnis stark vom Messkonzept ab, insbesondere von der Bereinigung um
    die Struktur der Erwerbstätigen. Vor Livegang aus AMECO oder Statistik
    Austria selbst rechnen und dann Punktwerte ergänzen.
    ZWEITER TEIL IST GEGENARGUMENT und gehört in den Kasten: Die Lohnquote
    ist seit dem Inflationsschock 2022/23 deutlich gestiegen, in Österreich
    stärker als in vielen anderen Ländern. Wer aus dem langfristigen
    Rückgang eine Richtungsaussage ableitet, ignoriert das.
    KEINE Kausalaussage zur Einkommensstagnation - die Studie stützt sie
    nicht.


